apiVersion: apps/v1
kind: Deployment
metadata: 
  name: app1-hello
spec:
  replicas: 3
  selector:   
    matchLabels:
      app: app1-hello
  template:
    metadata: 
      labels:
        app: app1-hello
    spec:
      containers: 
      - name: app1-hello
        image: shik001/hello-spring:latest  
        # env:
        #   - name: ENV_VALUE 
        #     value: "Hello from app.yaml"
        #   - name: DB_PASSWORD  
        #     value: "1234567890"
        env:
          - name: ENV_VALUE
            valueFrom:
              configMapKeyRef:
                name: app1-config
                key: ENV_VALUE
          - name: DB_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: app1-config
                key: DB_PASSWORD 
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello-service
spec:
  selector:
    app: app1-hello
  type: NodePort
  ports: 
    - port: 8080
      targetPort: 8080
      nodePort: 32000