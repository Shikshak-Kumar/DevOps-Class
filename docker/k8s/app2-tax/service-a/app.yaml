apiVersion: apps/v1
kind: Deployment
metadata: 
  name: service-a
spec:
  replicas: 1
  selector:   
    matchLabels:
      app: service-a
  template:
    metadata: 
      labels:
        app: service-a
    spec:
      containers: 
      - name: service-a
        image: embarkx/tax-service-a:latest 
        env:
          - name: TAX_SERVICE_URL 
            value: "http://service-b:4000"
        #   - name: DB_PASSWORD  
        #     value: "1234567890"
        # env:
        #   - name: ENV_VALUE
        #     valueFrom:
        #       configMapKeyRef:
        #         name: app1-config
        #         key: ENV_VALUE
        #   - name: DB_PASSWORD
        #     valueFrom:
        #       configMapKeyRef:
        #         name: app1-config
        #         key: DB_PASSWORD 
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  type: NodePort
  ports: 
    - port: 3000
      targetPort: 3000
      nodePort: 32000