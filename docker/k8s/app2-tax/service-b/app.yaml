apiVersion: apps/v1
kind: Deployment
metadata: 
  name: service-b
spec:
  replicas: 1
  selector:   
    matchLabels:
      app: service-b
  template:
    metadata: 
      labels:
        app: service-b
    spec:
      containers: 
      - name: service-b
        image: embarkx/tax-service-b:latest
        # env:
        #   - name: ENV_VALUE 
        #     value: "Hello from app.yaml"
        #   - name: DB_PASSWORD  
        #     value: "1234567890"
        # env:
        #   - name: ENV_VALUE
        #     valueFrom:
        #       configMapKeyRef:
        #         name: app1-config
        #         key: ENV_VALUE
        #   - name: DB_PASSWORD
        #     valueFrom:
        #       configMapKeyRef:
        #         name: app1-config
        #         key: DB_PASSWORD 
        ports:
        - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b
  type: ClusterIP
  ports: 
    - port: 4000
      targetPort: 4000